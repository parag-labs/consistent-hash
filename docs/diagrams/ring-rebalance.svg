"#6b7794">One circle, virtual nodes, first owner clockwise: adding a node re-owns one arc, so only ~1/N keys move.</text><rect x="60" y="172" width="650" height="336" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="78" y="163" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">BEFORE - 3 NODES</text><rect x="850" y="172" width="650" height="336" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="868" y="163" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#552fae">AFTER - ADD NODE D</text><circle cx="385" cy="340" r="118" fill="none" stroke="#8494ab" stroke-width="2" stroke-opacity="0.45"/><path d="M274.12,380.36 A118,118 0 0,1 425.36,229.12" fill="none" stroke="#2f9e6e" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M425.36,229.12 A118,118 0 0,1 460.85,430.39" fill="none" stroke="#4285f4" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M460.85,430.39 A118,118 0 0,1 274.12,380.36" fill="none" stroke="#e0a13a" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M353.05,306.91 A46,46 0 0,1 414.57,304.76" fill="none" stroke="#8494ab" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#ah-slate)"/><text x="385" y="284" text-anchor="middle" font-size="11" fill="#6b7794">clockwise</text><text x="385" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16203a">FNV-1a</text><text x="385" y="366" text-anchor="middle" font-size="11" fill="#6b7794">0 .. 2³²-1</text><circle cx="401.42" cy="223.15" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="477.99" cy="267.35" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="502.35" cy="352.33" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="477.99" cy="412.65" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="401.42" cy="456.85" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="326.00" cy="442.19" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="284.93" cy="402.53" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="267.07" cy="344.12" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="275.59" cy="295.80" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="292.01" cy="267.35" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="352.47" cy="226.57" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="409.53" cy="224.58" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="425.36" cy="229.12" r="8" fill="#2f9e6e" stroke="#ffffff" stroke-width="2"/><text x="433.91" y="210.22" text-anchor="middle" font-size="14" font-weight="700" fill="#186547">A</text><circle cx="460.85" cy="430.39" r="8" fill="#4285f4" stroke="#ffffff" stroke-width="2"/><text x="476.92" y="454.14" text-anchor="middle" font-size="14" font-weight="700" fill="#17509f">B</text><circle cx="274.12" cy="380.36" r="8" fill="#e0a13a" stroke="#ffffff" stroke-width="2"/><text x="250.62" y="393.51" text-anchor="middle" font-size="14" font-weight="700" fill="#8c5a0d">C</text><text x="385" y="490" text-anchor="middle" font-size="12.5" fill="#6b7794">owner = first node clockwise</text><circle cx="1175" cy="340" r="118" fill="none" stroke="#8494ab" stroke-width="2" stroke-opacity="0.45"/><path d="M1099.15,249.61 A118,118 0 0,1 1215.36,229.12" fill="none" stroke="#2f9e6e" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M1215.36,229.12 A118,118 0 0,1 1250.85,430.39" fill="none" stroke="#4285f4" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M1250.85,430.39 A118,118 0 0,1 1064.12,380.36" fill="none" stroke="#e0a13a" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M1064.12,380.36 A118,118 0 0,1 1099.15,249.61" fill="none" stroke="#8b5cf6" stroke-width="11" stroke-linecap="butt" stroke-opacity="0.9"/><path d="M1143.05,306.91 A46,46 0 0,1 1204.57,304.76" fill="none" stroke="#8494ab" stroke-width="1.8" stroke-opacity="0.6" marker-end="url(#ah-slate)"/><text x="1175" y="284" text-anchor="middle" font-size="11" fill="#6b7794">clockwise</text><text x="1175" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16203a">FNV-1a</text><text x="1175" y="366" text-anchor="middle" font-size="11" fill="#6b7794">0 .. 2³²-1</text><circle cx="1191.42" cy="223.15" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1267.99" cy="267.35" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1292.35" cy="352.33" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1267.99" cy="412.65" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1191.42" cy="456.85" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1116.00" cy="442.19" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1074.93" cy="402.53" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1057.07" cy="344.12" r="5.5" fill="#ece5f9" stroke="#8b5cf6" stroke-width="2"/><circle cx="1065.59" cy="295.80" r="5.5" fill="#ece5f9" stroke="#8b5cf6" stroke-width="2"/><circle cx="1082.01" cy="267.35" r="5.5" fill="#ece5f9" stroke="#8b5cf6" stroke-width="2"/><circle cx="1142.47" cy="226.57" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1199.53" cy="224.58" r="4.5" fill="#ffffff" stroke="#16203a" stroke-width="1.6"/><circle cx="1215.36" cy="229.12" r="8" fill="#2f9e6e" stroke="#ffffff" stroke-width="2"/><text x="1223.91" y="210.22" text-anchor="middle" font-size="14" font-weight="700" fill="#186547">A</text><circle cx="1250.85" cy="430.39" r="8" fill="#4285f4" stroke="#ffffff" stroke-width="2"/><text x="1266.92" y="454.14" text-anchor="middle" font-size="14" font-weight="700" fill="#17509f">B</text><circle cx="1064.12" cy="380.36" r="8" fill="#e0a13a" stroke="#ffffff" stroke-width="2"/><text x="1040.62" y="393.51" text-anchor="middle" font-size="14" font-weight="700" fill="#8c5a0d">C</text><circle cx="1099.15" cy="249.61" r="13" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.4"/><circle cx="1099.15" cy="249.61" r="9" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/><text x="1083.08" y="235.06" text-anchor="middle" font-size="14" font-weight="700" fill="#552fae">D</text><path d="M1048.14,386.17 A135,135 0 0,1 1088.22,236.58" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="butt" stroke-opacity="0.85" stroke-dasharray="6 5"/><rect x="933.048" y="370.0" width="115.904" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="991" y="386.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">keys that moved</text><text x="1175" y="490" text-anchor="middle" font-size="12.5" fill="#6b7794">D re-owns only the arc behind it</text><path d="M712,340 L848,340" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="737.024" y="328.0" width="85.952" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="780.0" y="344.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">add node D</text><rect x="60" y="548" width="1440" height="192" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="78" y="539" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">HOW A KEY FINDS ITS NODE</text><rect x="134" y="584" width="400" height="136" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(322.0,598) scale(1.0000)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="334.0" y="642" text-anchor="middle" font-size="16.5" font-weight="700" fill="#136b74">Place on one circle</text><text x="334.0" y="663.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">nodes -&gt; R virtual points</text><text x="334.0" y="680.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">keys -&gt; one point each</text><text x="334.0" y="698.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">FNV-1a, 32-bit space</text><rect x="580" y="584" width="400" height="136" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(768.0,598) scale(1.0000)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></g><text x="780.0" y="642" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">Own it clockwise</text><text x="780.0" y="663.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">first slot clockwise</text><text x="780.0" y="680.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">of the key, then wrap</text><text x="780.0" y="698.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">binary search, O(log V)</text><rect x="1026" y="584" width="400" height="136" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1214.0,598) scale(1.0000)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1226.0" y="642" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">Change stays local</text><text x="1226.0" y="663.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">only the arcs next to</text><text x="1226.0" y="680.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">that node change hands</text><text x="1226.0" y="698.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">~1/(N+1) of keys move</text><path d="M534,652 L580,652" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M980,652 L1026,652" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="60" y="770" width="700" height="113.6" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="76" y="794" font-size="13.2" font-weight="700" fill="#8c5a0d">Virtual nodes make it fair</text><text x="76" y="816" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Schematic shows 1 marker/node; each real node</text><text x="76" y="834.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">gets R points (R=100), so D takes many small arcs.</text><text x="76" y="852.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">1 point/node -&gt; 101% load spread; ~200 pts -&gt; 26%.</text><text x="76" y="871.1999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Removal scatters keys across many neighbors.</text><rect x="800" y="770" width="700" height="113.6" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="816" y="794" font-size="13.2" font-weight="700" fill="#186547">Only ~1/N moves - and it is portable</text><text x="816" y="816" font-size="12.4" fill="#186547" fill-opacity="0.92">Add 1 node to 64: ~1.0% of keys move,</text><text x="816" y="834.4" font-size="12.4" fill="#186547" fill-opacity="0.92">versus ~98.5% for hash % N - a cache-miss storm.</text><text x="816" y="852.8" font-size="12.4" fill="#186547" fill-opacity="0.92">FNV-1a is fixed; a slot collision nudges +1,</text><text x="816" y="871.1999999999999" font-size="12.4" fill="#186547" fill-opacity="0.92">deterministically, so all six ports agree.</text><text x="780.0" y="922" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/consistent-hash</text></svg>